name: Publish Askr package

on:
  workflow_call:
    inputs:
      install-playwright:
        description: Install every supported Playwright browser before the complete package gate.
        required: false
        type: boolean
        default: false
permissions: {}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      - name: Validate Askr package contract
        uses: askrjs/actions/actions/validate-package-contract@4e94f4740a91900b999058c0e9601ba3623d61f7

      - name: Install browser engines
        if: inputs.install-playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run complete release gate
        run: npm run check

  publish:
    name: Tag and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Compute release tag
        id: version
        uses: askrjs/actions/actions/compute-release-tag@4e94f4740a91900b999058c0e9601ba3623d61f7

      - name: Reject unreleased scaffolds
        if: steps.version.outputs.version == '0.0.0'
        shell: bash
        run: |
          echo 'Package version 0.0.0 is an unreleased scaffold and cannot be published.'
          exit 1

      - name: Check whether tag exists
        id: tag_status
        uses: askrjs/actions/actions/check-tag-exists@4e94f4740a91900b999058c0e9601ba3623d61f7
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Verify an existing tag points to this commit
        if: steps.tag_status.outputs.exists == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"

      - run: npm ci

      - name: Validate Askr package contract
        uses: askrjs/actions/actions/validate-package-contract@4e94f4740a91900b999058c0e9601ba3623d61f7

      - name: Create release tag
        if: steps.tag_status.outputs.exists != 'true'
        uses: askrjs/actions/actions/create-tag@4e94f4740a91900b999058c0e9601ba3623d61f7
        with:
          tag: ${{ steps.version.outputs.tag }}

      - name: Publish to npm
        uses: askrjs/actions/actions/publish-package@4e94f4740a91900b999058c0e9601ba3623d61f7
