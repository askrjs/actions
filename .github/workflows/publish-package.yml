name: Publish Askr package

on:
  workflow_call:
    inputs:
      install-playwright:
        description: Install every supported Playwright browser before the complete package gate.
        required: false
        type: boolean
        default: false
permissions: {}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Validate Askr package contract
        uses: askrjs/actions/actions/validate-package-contract@main

      - name: Install browser engines
        if: inputs.install-playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run complete release gate
        run: npm run check

  publish:
    name: Tag and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Compute release tag
        id: version
        uses: askrjs/actions/actions/compute-release-tag@main

      - name: Reject unreleased scaffolds
        if: steps.version.outputs.version == '0.0.0'
        shell: bash
        run: |
          echo 'Package version 0.0.0 is an unreleased scaffold and cannot be published.'
          exit 1

      - name: Check whether tag exists
        id: tag_status
        uses: askrjs/actions/actions/check-tag-exists@main
        with:
          tag: ${{ steps.version.outputs.tag }}
      - name: Verify an existing tag points to this commit
        if: steps.tag_status.outputs.exists == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        if: inputs.install-playwright
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate Askr package contract
        uses: askrjs/actions/actions/validate-package-contract@main

      - name: Create release tag
        if: steps.tag_status.outputs.exists != 'true'
        uses: askrjs/actions/actions/create-tag@main
        with:
          tag: ${{ steps.version.outputs.tag }}
      - name: Publish to npm
        run: npm publish --provenance --access public
