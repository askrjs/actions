name: Private process boundary source qualification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    name: Private boundary fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Tests-first availability RED must identify the absent new worker
        shell: bash
        run: node --test --test-name-pattern='new source availability' tests/private-boundary-native.test.mjs
      - name: Prepare explicit nonrelease native fixture request
        shell: bash
        run: |
          shell_path="$(command -v bash)"
          if [[ "$RUNNER_OS" == 'Windows' ]]; then shell_path="$(cygpath -w "$shell_path")"; fi
          BOUNDARY_FIXTURE_BASH="$shell_path" node tests/private-boundary-native.test.mjs --prepare-composite
      - name: Actual composite normal tooling-only bootstrap under startup-injection fixture
        uses: ./actions/private-caller-boundary
        env:
          NODE_OPTIONS: --require=${{ env.BOUNDARY_FIXTURE_NODE_INJECT }}
          NODE_PATH: /fixture/unapproved-node-path
          BASH_ENV: ${{ env.BOUNDARY_FIXTURE_SHELL_INJECT }}
          ENV: ${{ env.BOUNDARY_FIXTURE_SHELL_INJECT }}
        with:
          setup-node: 'true'
          request-base64: ${{ env.BOUNDARY_FIXTURE_REQUEST }}
          request-sha256: ${{ env.BOUNDARY_FIXTURE_DIGEST }}
      - name: Actual composite rejects mixed-case proxy before a valid owner operation
        id: reject-proxy
        continue-on-error: true # This one expected-failure fixture must be asserted below.
        uses: ./actions/private-caller-boundary
        env:
          hTtPs_PrOxY: http://127.0.0.1:9/
        with:
          request-base64: ${{ env.BOUNDARY_PROXY_REQUEST }}
          request-sha256: ${{ env.BOUNDARY_PROXY_DIGEST }}
      - name: Exercise native process, normal fixture lifecycle and cleanup controls
        shell: bash
        env:
          BOUNDARY_PROXY_OUTCOME: ${{ steps.reject-proxy.outcome }}
        run: node --test tests/private-boundary-native.test.mjs
      - name: Retain every produced fixture receipt and raw log on failure or success
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-boundary-fixtures-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/askr-private-boundary-native/
            ${{ runner.temp }}/askr-0.5-private-*/receipts/
            ${{ runner.temp }}/askr-0.5-candidate-*/cleanup.json
            ${{ runner.temp }}/askr-0.5-candidate-*/server.json
            ${{ runner.temp }}/askr-0.5-candidate-*/registry-process.log
          if-no-files-found: warn
