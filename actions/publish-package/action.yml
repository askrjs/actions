name: Publish package to npm
description: Publish an npm package with provenance support using an explicit npm dist-tag.
inputs:
  package-json-path:
    description: Path to the package.json file for the package to publish.
    required: false
    default: package.json
  registry:
    description: npm registry URL.
    required: false
    default: https://registry.npmjs.org/
  access:
    description: Package access level for publish.
    required: false
    default: public
  npm-tag:
    description: npm dist-tag to publish under.
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Setup npm registry
      shell: bash
      env:
        INPUT_REGISTRY: ${{ inputs.registry }}
      run: |
        npm config set registry "$INPUT_REGISTRY"

    - name: Publish package
      shell: bash
      env:
        INPUT_PACKAGE_JSON_PATH: ${{ inputs.package-json-path }}
        INPUT_NPM_TAG: ${{ inputs.npm-tag }}
        INPUT_ACCESS: ${{ inputs.access }}
      run: |
        project_dir=$(dirname "$INPUT_PACKAGE_JSON_PATH")
        cd "$project_dir"

        npm publish . --tag "$INPUT_NPM_TAG" --access "$INPUT_ACCESS" --provenance
